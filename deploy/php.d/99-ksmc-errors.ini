; ksmc_web用の本番エラー表示設定（デプロイ前最終確認で追加）。
;
; display_errorsがOnのままだと、未捕捉の例外やWarning/Noticeがスタックトレース・
; サーバー内部のファイルパスごと訪問者の画面にそのまま表示されてしまう
; （情報漏洩）。本番では必ずOffにし、ログにのみ記録する。
;
; error_logは明示せず空のままにする。php.iniのデフォルト（Apache SAPIでは
; Webサーバーのエラーログ、通常/var/log/httpd/error_log）に出力させることで、
; 独自ログファイルのパーミッション設定漏れ（.envと同種の落とし穴、10章教訓1参照）
; を避ける。

display_errors = Off
display_startup_errors = Off
log_errors = On
