; ksmc_web用のPHPアップロード上限調整（本番相当環境での検証で判明した問題への対応）。
;
; RHEL系のPHPパッケージ既定値（upload_max_filesize=2M, post_max_size=8M）のままだと、
; アプリ側が想定する1投稿あたりの上限（src/Config/Uploads.php の MAX_TOTAL_BYTES = 16MB、
; MAX_FILE_COUNT = 10）に遠く及ばず、2MBを超える画像がPHPの受付段階で拒否されてしまう。
;
; upload_max_filesizeは単一ファイルの上限（1枚で16MB分をアップロードするケースを想定し
; MAX_TOTAL_BYTESより少し余裕を持たせる）、post_max_sizeはリクエスト全体（複数画像＋本文
; 等のフィールド＋multipartのオーバーヘッド）の上限のため、upload_max_filesizeより大きくする。
;
; MAX_TOTAL_BYTES / MAX_FILE_COUNT を変更した場合は、この値も合わせて見直すこと。

upload_max_filesize = 20M
post_max_size = 24M

; max_file_uploads（既定20）はMAX_FILE_COUNT=10に対して十分余裕があるため変更不要。
